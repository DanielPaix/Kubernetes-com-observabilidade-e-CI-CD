name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push - Gateway
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest ./api-gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

      - name: Build e Push - Pedidos
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/pedidos-service:latest ./pedidos-service
          docker push ${{ secrets.DOCKER_USERNAME }}/pedidos-service:latest

      - name: Build e Push - Pagamentos
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/pagamentos-service:latest ./pagamentos-service
          docker push ${{ secrets.DOCKER_USERNAME }}/pagamentos-service:latest
