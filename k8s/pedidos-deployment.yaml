apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedidos
  template:
    metadata:
      labels:
        app: pedidos
    spec:
      containers:
        - name: pedidos-container
          image: kubernetes-com-observabilidade-e-ci-cd-pedidos-service
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
