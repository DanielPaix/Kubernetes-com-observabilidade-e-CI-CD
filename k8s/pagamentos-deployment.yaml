apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamentos-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pagamentos
  template:
    metadata:
      labels:
        app: pagamentos
    spec:
      containers:
        - name: pagamentos-container
          image: kubernetes-com-observabilidade-e-ci-cd-pagamentos-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PAYMENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pagamentos-secret
                  key: PAYMENT_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"


